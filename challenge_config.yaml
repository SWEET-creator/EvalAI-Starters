# If you are not sure what all these fields mean, please refer our documentation here:
# https://evalai.readthedocs.io/en/latest/configuration.html
title: anime colorization code upload
short_description: Code upload challenge for anime colorization on hidden geometric sequence data
description: templates/description.html
evaluation_details: templates/evaluation_details.html
terms_and_conditions: templates/terms_and_conditions.html
image: logo.jpg
submission_guidelines: templates/submission_guidelines.html
category: [Dataset]
leaderboard_description: Leaderboard for code-upload anime colorization submissions.
evaluation_script: evaluation_script.zip
remote_evaluation: False
is_docker_based: True
is_static_dataset_code_upload: True
submission_time_limit: 1800
cpu_only_jobs: True
job_cpu_cores: "1"
job_memory: "2048Mi"
ephemeral_storage: 10
worker_python_version: "3.9"
start_date: 2026-06-23 00:00:00
end_date: 2099-12-31 23:59:59
published: True
tags:
  - anime-colorization
  - code-upload
  - computer-vision

leaderboard:
  - id: 1
    schema:
      {
        "labels": ["score", "segment_accuracy", "prediction_coverage", "frame_coverage"],
        "default_order_by": "score",
        "metadata": {
          "score": {
            "sort_ascending": False,
            "description": "Mean of segment accuracy and prediction coverage.",
          },
          "segment_accuracy": {
            "sort_ascending": False,
            "description": "Fraction of visible segments with the correct predicted color.",
          },
          "prediction_coverage": {
            "sort_ascending": False,
            "description": "Fraction of visible segments for which a prediction was supplied.",
          },
          "frame_coverage": {
            "sort_ascending": False,
            "description": "Fraction of frames for which at least one segment prediction was supplied.",
          },
        },
      }

challenge_phases:
  - id: 1
    name: Test Phase
    description: templates/challenge_phase_1_description.html
    leaderboard_public: True
    is_public: True
    challenge: 1
    is_active: True
    max_concurrent_submissions_allowed: 3
    allowed_email_ids: []
    disable_logs: False
    is_submission_public: True
    start_date: 2026-06-23 00:00:00
    end_date: 2099-12-31 23:59:59
    test_annotation_file: annotations/test_annotations_testsplit.json
    codename: test
    max_submissions_per_day: 20
    max_submissions_per_month: 200
    max_submissions: 1000
    default_submission_meta_attributes:
      - name: method_name
        is_visible: True
      - name: method_description
        is_visible: True
      - name: project_url
        is_visible: True
      - name: publication_url
        is_visible: True
    is_restricted_to_select_one_submission: False
    is_partial_submission_evaluation_enabled: False
    allowed_submission_file_types: ".json"

dataset_splits:
  - id: 1
    name: Test Split
    codename: test_split

challenge_phase_splits:
  - challenge_phase_id: 1
    leaderboard_id: 1
    dataset_split_id: 1
    visibility: 1
    leaderboard_decimal_precision: 6
    is_leaderboard_order_descending: True
    show_execution_time: True
    show_leaderboard_by_latest_submission: True
